
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whusnet OLT Script Pro</title>
  <meta name="description" content="A high-performance OLT configuration script generator with a modern UI, supporting multi-site management and real-time script preview.">
  <meta property="og:title" content="Whusnet OLT Script Pro">
  <meta property="og:description" content="A high-performance OLT configuration script generator with a modern UI, supporting multi-site management and real-time script preview.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- xterm.js for real terminal emulation -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    /* Xterm Customization */
    .xterm .xterm-viewport {
      background-color: #050505 !important;
    }

    /* Light Theme Styles */
    html.light-mode body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.light-mode .bg-\[\#020617\] {
      background-color: #f8fafc !important;
    }
    html.light-mode .bg-slate-900 {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
      color: #0f172a !important;
    }
    html.light-mode .bg-slate-950 {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    html.light-mode .bg-slate-800 {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    html.light-mode .bg-slate-800\/50 {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
    }
    html.light-mode .border-slate-800,
    html.light-mode .border-slate-700,
    html.light-mode .border-slate-700\/60 {
      border-color: #e2e8f0 !important;
    }
    html.light-mode .text-slate-200,
    html.light-mode .text-white {
      color: #0f172a !important;
    }
    html.light-mode .text-slate-400 {
      color: #475569 !important;
    }
    html.light-mode .text-slate-500 {
      color: #64748b !important;
    }
    html.light-mode input,
    html.light-mode select,
    html.light-mode textarea {
      color: #0f172a !important;
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
    }
    html.light-mode input::placeholder,
    html.light-mode textarea::placeholder {
      color: #94a3b8 !important;
    }
    html.light-mode pre {
      background-color: #0f172a !important;
      color: #38bdf8 !important;
    }
    html.light-mode .xterm,
    html.light-mode .xterm .xterm-viewport {
      background-color: #050505 !important;
      color: #10b981 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
